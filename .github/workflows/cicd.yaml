name: cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    outputs:
      commit_id: ${{ env.COMMIT_ID }}
    runs-on: ubuntu-latest
    steps:
      - name: Declare some variables
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: shrikanth06/python-app:${{ env.COMMIT_ID }}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v2
      - name: Modify values file
        shell: bash
        run: |    
          echo ${{needs.ci.outputs.commit_id}}
          mkdir -p "$HOME/.local/bin"

          python3 -c "import urllib.request,os; urllib.request.urlretrieve('https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64', os.path.expanduser('~/.local/bin/yq'))"
          chmod +x "$HOME/.local/bin/yq"
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$HOME/.local/bin:$PATH"

          COMMIT_ID="${{ needs.ci.outputs.commit_id }}"
          echo "Updating image tag to: $COMMIT_ID"
          yq -i '.image.tag = "${{ needs.ci.outputs.commit_id }}"' charts/python-app/values.yaml
          echo "Updated values.yaml:"

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'updates values.yaml with commit ${{ needs.ci.outputs.commit_id }}'

      - name: Install argocd
        shell: bash
        run: |
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd
      - name: argocd app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd --insecure --grpc-web --username admin --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync python-app-argo